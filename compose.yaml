# Docker Compose Configuration for RuangKita (K10)
# Strict adherence to Komputasi Awan DevOps Specification

services:
  # 1. Service Aplikasi (RuangKita Web/API)
  app:
    image: ${DOCKERHUB_USER:-allfridhosaragi}/ruangkita:${APP_TAG:-latest}
    container_name: ruangkita_app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ruangkita_db}
      - DB_USER=${DB_USER:-ruangkita_user}
      - DB_PASSWORD=${DB_PASSWORD:-ruangkita_secret_password}
      - SIMULATE_HEALTH_FAILURE=${SIMULATE_HEALTH_FAILURE:-false}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ruangkita_public_net
      - ruangkita_backend_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 2. Service Database (PostgreSQL 16)
  database:
    image: postgres:16-alpine
    container_name: ruangkita_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ruangkita_db}
      POSTGRES_USER: ${DB_USER:-ruangkita_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ruangkita_secret_password}
    volumes:
      - ruangkita_postgres_data:/var/lib/postgresql/data
    networks:
      - ruangkita_backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ruangkita_user} -d ${DB_NAME:-ruangkita_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

# Jaringan Terisolasi & Volume Persisten
networks:
  # Jaringan publik untuk akses browser / reverse proxy
  ruangkita_public_net:
    driver: bridge
  # Jaringan internal terisolasi (database tidak dapat diakses dari luar)
  ruangkita_backend_net:
    driver: bridge
    internal: true

volumes:
  ruangkita_postgres_data:
    driver: local
